cas.authn.accept.users: jleleu::jleleu,leleuj::leleuj

cas.tgc.secure: false
cas.tgc.same-site-policy: Lax

cas.tgc.crypto.enabled: false
cas.webflow.crypto.enabled: false

cas.server.name: http://localhost:8080
cas.server.prefix: ${cas.server.name}/cas
cas.host.name: castest

cas.authn.oauth.code.timeToKillInSeconds: 30000
cas.authn.oauth.code.numberOfUses: 10000

cas.authn.pac4j.saml[0].clientName: SAML2Clientlocalhost
cas.authn.pac4j.saml[0].keystorePassword: pac4j-demo-passwd
cas.authn.pac4j.saml[0].privateKeyPassword: pac4j-demo-passwd
cas.authn.pac4j.saml[0].keystorePath: classpath:/samlKeystore.jks
cas.authn.pac4j.saml[0].metadata.identityProviderMetadataPath: https://www.casserverpac4j.dev/idp/metadata
cas.authn.pac4j.saml[0].serviceProviderEntityId: http://localhost:8080/cas/login?client_name=SAML2Clientlocalhost
cas.authn.pac4j.saml[0].metadata.service-provider.file-system.location: classpath:/sp-metadata-8080-localhost.xml

cas.authn.pac4j.cas[0].clientName: CASClient
cas.authn.pac4j.cas[0].loginUrl: https://www.casserverpac4j.dev/login

cas.authn.pac4j.oidc[0].generic.clientName: OIDCClient
cas.authn.pac4j.oidc[0].generic.id: myclient
cas.authn.pac4j.oidc[0].generic.secret: mysecret
cas.authn.pac4j.oidc[0].generic.discovery-uri: https://www.casserverpac4j.dev/oidc/.well-known
cas.authn.pac4j.oidc[0].generic.use-nonce: true
cas.authn.pac4j.oidc[0].generic.preferred-jws-algorithm: RS256

cas.ticket.st.numberOfUses: 1000
cas.ticket.st.timeToKillInSeconds: 10000

cas.serviceRegistry.json.location: classpath:/services

server.port: 8080
server.ssl.enabled: false
cas.server.tomcat.httpProxy.enabled: false
cas.server.tomcat.http:
  - enabled: false
